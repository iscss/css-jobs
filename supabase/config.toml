project_id = "vbekddjiflstedhvrhwt"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = ["http://localhost:8080"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

# Ingestion is invoked by cron with the service role key, not by a signed-in
# user, so the built-in JWT check is bypassed. The function verifies the
# service role key itself.
[functions.ingest-jobs]
verify_jwt = false

[functions.check-listings]
verify_jwt = false
